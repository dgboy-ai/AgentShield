[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "1.0.0"
description = "Tamper-evident memory defense for LLM agents — hash chains, constraint pinning, poisoning detection, and compliance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Divyansh Gupta" },
    { name = "Tejshvee" },
]
keywords = ["ai", "security", "llm", "agents", "memory", "hash-chain", "compliance", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.scripts]
agentshield = "agentshield.cli:main"

[project.optional-dependencies]
cli = [
    "click>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/agentshield/agentshield"
Documentation = "https://docs.agentshield.io"
Repository = "https://github.com/agentshield/agentshield"

[tool.hatch.build.targets.wheel]
packages = ["agentshield"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
